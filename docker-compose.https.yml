services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - docker.env
    volumes:
      - ~/.aws:/root/.aws:ro
    environment:
      - S3_REGION=${S3_REGION:-us-west-2}
      - PINECONE_REGION=${PINECONE_REGION:-us-east-1}
      - PINECONE_ENV=${PINECONE_ENV:-aws-us-east-1}
      - BEDROCK_REGION=${BEDROCK_REGION:-us-west-2}
      - OPENAI_API_KEY_SECRET_ARN=${OPENAI_API_KEY_SECRET_ARN:-}
      - PINECONE_API_KEY_SECRET_ARN=${PINECONE_API_KEY_SECRET_ARN:-}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-benefitsflow}
      - PINECONE_DIM=${PINECONE_DIM:-1536}
      - EMBED_MODEL=${EMBED_MODEL:-text-embedding-3-small}
      - LLM_MODEL=${LLM_MODEL:-openai.gpt-oss-120b-1:0}
    ports:
      - "8000:8000"
    networks:
      - bfnet
    restart: unless-stopped
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    env_file:
      - docker.env
    volumes:
      - ~/.aws:/root/.aws:ro
      - benefitsflow_metrics:/app/data
    environment:
      # For single instance (docker-compose): use service name
      # For two separate EC2 instances: set RAG_API_URL in docker.env to RAG instance's private IP
      - RAG_API_URL=${RAG_API_URL:-http://app:8000}
    ports:
      - "8501:8501"
    depends_on:
      - app
    networks:
      - bfnet
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - ui
    networks:
      - bfnet
    restart: unless-stopped

networks:
  bfnet:
    driver: bridge

volumes:
  benefitsflow_metrics:
    driver: local

